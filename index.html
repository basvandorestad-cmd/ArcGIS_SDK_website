<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>ArcGIS Test</title>

  <link rel="stylesheet"
    href="https://js.arcgis.com/4.34/esri/themes/light/main.css">

  <script src="https://js.arcgis.com/4.34/"></script>

  <style>
    html,
    body {
      margin: 0;
      height: 100%;
    }

    #viewDiv {
      position: absolute;
      top: 20px;
      left: 20px;
      width: 400px;
      height: 300px;
    }
  </style>
</head>

<body>

  <div id="viewDiv"></div>

  <script>
    require([
      "esri/WebMap",
      "esri/views/MapView"
    ], function (
      WebMap,
      MapView
    ) {

      const webmap = new WebMap({
        portalItem: {
          id: "YOUR_WEBMAP_ID"
        }
      });

      const view = new MapView({
        container: "viewDiv",
        map: webmap
      });

    });
  </script>

</body>
</html>
